name: OSS Contributions Ledger
description: Keep a permanent record of your open-source contributions in CONTRIBUTIONS.md and your profile README.
author: Yash B Joshi
branding:
  icon: book-open
  color: purple

inputs:
  username:
    description: GitHub login whose contributions are recorded.
    default: ${{ github.repository_owner }}
  token:
    description: Token used for the GitHub GraphQL API. The workflow's own token is enough for public work.
    default: ${{ github.token }}
  ledger:
    description: Path of the ledger data file. Commit it; it is the durable record.
    default: ledger.json
  output:
    description: Path of the rendered Markdown.
    default: CONTRIBUTIONS.md
  exclude:
    description: Comma-separated repositories to leave out, as "owner/repo" or "owner/*".
    default: ""
  discussions:
    description: "\"true\" to also record issues you commented on without opening."
    default: "false"
  header:
    description: Path of a Markdown file shown at the top instead of the default title.
    default: ""
  readme:
    description: Path of a file, usually README.md, whose marked block gets the summary and the latest merged pull requests.
    default: ""
  readme-latest:
    description: How many latest merged pull requests the README block lists.
    default: "3"

outputs:
  changed:
    description: "\"true\" when the ledger, the Markdown or the README changed."

runs:
  using: docker
  image: Dockerfile
